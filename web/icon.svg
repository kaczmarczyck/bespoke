<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#1e1e24" />
  <g transform="translate(106, 106)">
    <!-- Stack of cards effect -->
    <rect x="30" y="30" width="240" height="240" rx="24" fill="#272730" stroke="#3f3f46" stroke-width="4" transform="rotate(-6 150 150)"/>
    <rect x="15" y="15" width="240" height="240" rx="24" fill="#272730" stroke="#3f3f46" stroke-width="4" transform="rotate(-3 150 150)"/>
    <!-- Top card -->
    <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#grad)" stroke="#0284c7" stroke-width="2"/>
    <!-- Inside content (Character A and character 文 for languages) -->
    <text x="50" y="145" fill="#f4f4f5" font-family="'Outfit', sans-serif" font-size="80" font-weight="bold">A</text>
    <text x="130" y="155" fill="#f4f4f5" font-family="'Outfit', sans-serif" font-size="70" font-weight="bold">文</text>
  </g>
</svg>
